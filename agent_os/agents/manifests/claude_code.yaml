manifest_version: "1"
name: "Claude Code"
slug: "claude-code"
description: "Anthropic's autonomous coding agent"
author: "anthropic"
version: "1.0.0"

runtime:
  adapter: cli
  command: "claude"
  transport: sdk
  mode: pipe
  args: ["--output-format", "stream-json", "--verbose"]
  prompt_flag: "-p"
  resume_flag: "--resume"
  session_id_pattern: '"session_id":\s*"([^"]+)"'
  approval_patterns:
    - regex: "Do you want to proceed\\?"
      type: confirm
    - regex: "Allow this action\\?"
      type: confirm
  activity_patterns:
    - regex: "Reading file: (.+)"
      label: "Read {1}"
    - regex: "Writing file: (.+)"
      label: "Write {1}"
    - regex: "Running: (.+)"
      label: "Shell: {1}"

setup:
  dependencies:
    - name: "Node.js"
      check_command: "node --version"
      min_version: "18.0.0"
      install:
        windows: "winget install OpenJS.NodeJS"
        macos: "brew install node"
  install_command: "npm install -g @anthropic-ai/claude-code"
  check_command: "claude --version"
  # Spec 116 D1: the oldest CLI Orbital can drive. 2.1.114 is the first npm
  # release whose install carries a native `bin/claude.exe` (older packages
  # ship only `cli.js` + the `claude.cmd` shim, which claude-agent-sdk
  # refuses to spawn on Windows). It is NOT 2.1.41 — the version that added
  # the `claude auth status/login` subcommands this manifest probes with —
  # because a 2.1.41–2.1.112 install still has no exe to hand the SDK.
  # Checked offline against `check_command`'s output; no registry lookup.
  min_version: "2.1.114"
  # Spec 116 D2: the CLI's own updater (npm and native paths alike). Success
  # is decided by re-probing `--version` against the floor, never by exit
  # code (a pre-2.1.288 npm updater reports success with only the stub).
  update_command: "claude update"
  update_label: "Update Claude Code"
  credentials:
    - key: "claude_auth"
      label: "Claude Account"
      type: oauth_cli
      required: true
      check_command: "claude auth status --json"
      check_field: "loggedIn"
      check_value: "true"
      # `claude login` is NOT a subcommand — it parses as the positional
      # prompt, so the CLI answers conversationally and exits 0 without
      # authenticating anything (bug #64). Login lives under `auth`, the same
      # place `_resolve_setup_command` already sends logout.
      setup_command: "claude auth login"
      setup_label: "Log in to Claude"
  auto_detect:
    windows:
      - "%APPDATA%\\npm\\claude.cmd"
      - "%PROGRAMFILES%\\nodejs\\claude.cmd"
      # The native (non-npm) installer, `irm https://claude.ai/install.ps1 | iex`.
      - "%USERPROFILE%\\.local\\bin\\claude.exe"
    macos:
      - "/usr/local/bin/claude"
      - "$HOME/.local/bin/claude"
      - "$HOME/.claude/local/claude"
      - "$HOME/.npm-global/bin/claude"
      - "$HOME/.npm/bin/claude"
      - "/opt/homebrew/bin/claude"
      # Version managers (nvm, fnm, volta, pnpm, bun, node@XX kegs) install here
      # and put their PATH line in ~/.zshrc. The daemon's PATH capture (spec 115
      # D1) normally covers that; these globs are the second line of defence when
      # it cannot run (hostile rc file). `*` picks the newest version.
      - "$HOME/.nvm/versions/node/*/bin/claude"
      - "$HOME/.volta/bin/claude"
      - "$HOME/Library/pnpm/claude"
      - "$HOME/.bun/bin/claude"
      - "$HOME/.local/share/fnm/node-versions/*/installation/bin/claude"
      - "$HOME/Library/Application Support/fnm/node-versions/*/installation/bin/claude"
      - "/opt/homebrew/opt/node@*/bin/claude"
    linux:
      - "/usr/local/bin/claude"
      - "$HOME/.local/bin/claude"
      - "$HOME/.claude/local/claude"
      - "$HOME/.npm-global/bin/claude"
      # Version managers (nvm, fnm, volta, pnpm, bun, node@XX kegs) install here
      # and put their PATH line in ~/.zshrc. The daemon's PATH capture (spec 115
      # D1) normally covers that; these globs are the second line of defence when
      # it cannot run (hostile rc file). `*` picks the newest version.
      - "$HOME/.nvm/versions/node/*/bin/claude"
      - "$HOME/.volta/bin/claude"
      - "$HOME/.local/share/pnpm/claude"
      - "$HOME/.bun/bin/claude"
      - "$HOME/.local/share/fnm/node-versions/*/installation/bin/claude"

capabilities:
  skills:
    - code_generation
    - code_review
    - debugging
    - testing
    - refactoring
    - documentation
  input_types: [text, files]
  output_types: [text, files]
  file_extensions: [.py, .js, .ts, .jsx, .tsx, .rs, .go, .java, .rb, .c, .cpp, .h]
  routing_hint: "Use for coding tasks: writing code, debugging, testing, refactoring"
  needs_shell: true
  needs_network: true

permissions:
  network_domains:
    - "api.anthropic.com"
    - "sentry.io"
  shell: true
  workspace_access: read_write
  autonomy_recommended: check_in
