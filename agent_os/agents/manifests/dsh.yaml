manifest_version: "1"
name: "DeepSeek Harness"
slug: "dsh"
description: "DeepSeek's agent harness, driven over ACP from an Orbital-managed install"
author: "deepseek-ai"
version: "1.0.0"

runtime:
  adapter: cli
  command: "dsh-acp-demo"            # never on PATH; resolved via auto_detect below
  transport: acp-sdk
  mode: pipe
  interactive: false
  args: []                            # --config <per-spawn file> appended by the Task 4 renderer
  config_template: "cordis.template.yml"

setup:
  orbital_install:
    # Windows: gate lifted by spec 127 (2026-10-22). The composition is
    # OS-neutral (shutil staging, `npm ci` with no-window flags, PATHEXT-aware
    # node/npm lookup) and the lockfile resolves the sandbox to
    # @deepseek-ai/dsh-sandbox-windows-acl there. Must be verified on the
    # CI-built Orbital-Setup .exe (spec 127 V1–V3: install, dispatch,
    # sandbox); record the passing CI run id here. Until that line exists,
    # treat Windows as unverified — not as gated by design.
    platforms: [macos, linux, windows]
  auto_detect:
    macos:
      - "${ORBITAL_DATA_DIR}/agents/dsh/node_modules/.bin/dsh-acp-demo"
    linux:
      - "${ORBITAL_DATA_DIR}/agents/dsh/node_modules/.bin/dsh-acp-demo"
    windows:
      # npm's `.cmd` shim is the launcher CreateProcess can run. The
      # extensionless file beside it is a POSIX sh script and the `.ps1`
      # needs a PowerShell host; neither is a spawn target.
      - "${ORBITAL_DATA_DIR}/agents/dsh/node_modules/.bin/dsh-acp-demo.cmd"
  # No check_command: dsh-acp-demo is an ACP stdio server whose only option
  # is --config/-c (spec 127 V0: --version/--help both exit 1 with
  # ERR_PARSE_ARGS_UNKNOWN_OPTION). The locate card's Test therefore checks
  # existence + executability only (SetupEngine.test_override), and the
  # status sweep reports no cli_version for this agent.
  credentials:
    - key: "DEEPSEEK_API_KEY"
      label: "DeepSeek API Key"
      type: secret
      required: true
      env_var: "DEEPSEEK_API_KEY"     # REQUIRED — a credential without env_var is silently dropped (setup_engine.py:297)
    - key: "DEEPSEEK_BASE_URL"
      label: "DeepSeek API Base URL (optional; region-locked endpoints)"
      type: secret
      required: false
      env_var: "DEEPSEEK_BASE_URL"

capabilities:
  skills: [code_generation, debugging, testing, refactoring, documentation]
  input_types: [text, files]
  output_types: [text, files]
  routing_hint: "Use for coding tasks on DeepSeek models via the DeepSeek Harness"
  needs_shell: true
  needs_network: true
  emits_tool_activity: false          # drives the Task 5 silent-until-done copy

permissions:
  # NOTE: network_domains deliberately omitted. It would be documentation-only:
  # transport-backed sub-agents spawn outside the project sandbox/proxy
  # (cli_adapter.py:87-91), and api.deepseek.com is already in
  # DEFAULT_ALLOWLIST_DOMAINS (platform/types.py:79). dsh's own sandbox
  # plugins are the enforcement layer. Do not re-add it with a claim that
  # it constrains dsh egress.
  shell: true
  workspace_access: read_write
  autonomy_recommended: hands_off
